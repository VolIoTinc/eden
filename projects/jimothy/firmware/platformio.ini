; Jimothy bring-up firmware — serial only, no WiFi/MQTT.
; Purpose: calibrate the moisture probe (dry/wet) and verify the BME688 (BSEC2 IAQ)
; and LTR390 (lux + UV index). Once verified, Jimothy moves onto the shared Eden node
; firmware (../../../firmware) with the numbers captured here going into its config.json.
;
;   pio run -t upload && pio device monitor

[platformio]
default_envs = lolin_s2_mini

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
; Reuse Eden's host-tested logic library (moisturePct etc.)
lib_extra_dirs = ../../../firmware/lib
lib_deps =
    boschsensortec/bsec2@^1.10.2610
    boschsensortec/BME68x Sensor library@^1.3.40408
    adafruit/Adafruit LTR390 Library@^1.1.2
; S2 in button-forced bootloader can't be reset over USB; stops esptool reporting a bogus failure.
upload_flags = --after=no_reset

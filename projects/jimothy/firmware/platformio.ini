; Jimothy node firmware: sensors + WiFi/MQTT/OTA/web. Config in data/config.json (gitignored).
; First flash over USB: pio run -t upload && pio run -t uploadfs
; Afterwards: pio run -e ota -t upload (see [env:ota]).
;

[platformio]
default_envs = lolin_s2_mini

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -std=gnu++17 -DEDEN_FW_VERSION=\"0.2.1\"
build_unflags = -std=gnu++11
; Reuse Eden's host-tested logic library (moisturePct etc.)
lib_extra_dirs = ../../../firmware/lib
lib_deps =
    boschsensortec/bsec2@^1.10.2610
    boschsensortec/BME68x Sensor library@^1.3.40408
    adafruit/Adafruit LTR390 Library@^1.1.2
    bblanchon/ArduinoJson@^7.0.4
    256dpi/MQTT@^2.5.2
; S2 in button-forced bootloader can't be reset over USB; stops esptool reporting a bogus failure.
upload_flags = --after=no_reset

; Over-the-air upload once the node is on WiFi:
;   export EDEN_OTA_PW='<ota.password from config.json>'
;   pio run -e ota -t upload
[env:ota]
extends = env:lolin_s2_mini
upload_protocol = espota
upload_port = jimothy.local
upload_flags = --auth=${sysenv.EDEN_OTA_PW}

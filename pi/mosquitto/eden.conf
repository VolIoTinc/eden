# Eden broker config — drop into /etc/mosquitto/conf.d/eden.conf
# Listeners on LAN + Tailscale only. Never the LTE WAN.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/eden.passwd
acl_file /etc/mosquitto/eden.acl

# LAN (eth0 side of the camper network)
listener 1883 10.0.0.1

# Tailscale — uncomment and set to the Pi's tailscale0 IP for remote debugging
#listener 1883 100.x.y.z

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300

# Keep retained status messages across restarts, but bound queues so a dead
# subscriber can't balloon memory on the shared Pi.
max_queued_messages 1000
memory_limit 33554432

# systemd drop-in for Debian's mosquitto.service (installed by pi/install.sh as
# /etc/systemd/system/mosquitto.service.d/eden.conf).
#
# eden.conf binds the listener to the LAN address only (10.0.0.1 — binding is our
# firewall, the Pi has a public LTE interface). At boot that address can appear after
# mosquitto starts: "Error: Cannot assign requested address", five fast failures, and
# the stock unit's start limit gives up for good (observed 2026-11-13, 8 h outage).
[Unit]
After=network-online.target
Wants=network-online.target
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10

# systemd drop-in for the apt grafana-server unit — installed by pi/install.sh to
# /etc/systemd/system/grafana-server.service.d/eden.conf
# Bind to the Tailscale IP only (the Pi also has a public LTE interface) and cap memory
# like every other Eden unit on the shared gateway. __TS_IP__ is filled in at install.
[Service]
Environment=GF_SERVER_HTTP_ADDR=__TS_IP__
Environment=GF_SERVER_HTTP_PORT=3000
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
MemoryMax=256M

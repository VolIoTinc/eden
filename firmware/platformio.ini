[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -std=gnu++17 -DEDEN_FW_VERSION=\"0.1.0\"
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    256dpi/MQTT@^2.5.2
    gin66/FastAccelStepper@^0.30.15

; Host-side unit tests for the pure logic library (no hardware needed):
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
